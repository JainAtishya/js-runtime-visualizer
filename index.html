<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Runtime Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="app-header">
        <h1>JavaScript Runtime Visualizer</h1>
        <p>Understand how JavaScript code executes</p>
    </header>

    <main class="app-container">

        <section class="editor-panel">

            <div class="panel-header">
                <h2>Code Editor</h2>
            </div>

            <textarea
                id="code-editor"
                spellcheck="false"
                placeholder="Write your JavaScript code here..."
            ></textarea>

            <div class="editor-controls">
                <button id="run-btn">Run</button>
                <button id="step-btn">Step</button>
                <button id="pause-btn">Pause</button>
                <button id="reset-btn">Reset</button>
            </div>

        </section>


        <section class="runtime-panel">

            <div class="panel-header">
                <h2>Runtime</h2>
            </div>

            <section class="runtime-section">
                <h3>Call Stack</h3>
                <div id="call-stack" class="runtime-container">
                </div>
            </section>

            <section class="runtime-section">
                <h3>Web APIs</h3>
                <div id="web-apis" class="runtime-container">
                </div>
            </section>

            <section class="runtime-section">
                <h3>Microtask Queue</h3>
                <div id="microtask-queue" class="runtime-container">
                </div>
            </section>

            <section class="runtime-section">
                <h3>Task Queue</h3>
                <div id="task-queue" class="runtime-container">
                </div>
            </section>

            <section class="runtime-section">
                <h3>Event Loop</h3>
                <div id="event-loop" class="runtime-container">
                </div>
            </section>

        </section>

    </main>


    <section class="console-panel">

        <div class="panel-header">
            <h2>Console</h2>
        </div>

        <pre id="console-output"></pre>

    </section>


    <script type="module" src="js/app.js"></script>

</body>
</html>
